services:
  nginx:
    image: ${NGINX_IMAGE_NAME:-nginx}:${NGINX_IMAGE_TAG:-1.27-alpine}
    container_name: n8n-proxy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - n8n-proxy-network
    depends_on:
      - certbot

  certbot:
    image: ${CERTBOT_IMAGE_NAME:-certbot/certbot}:${CERTBOT_IMAGE_TAG:-v3.1.0}
    container_name: n8n-proxy-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - n8n-proxy-network

networks:
  n8n-proxy-network:
    external: true

